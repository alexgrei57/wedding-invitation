<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор превью</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f0e8;
            font-family: 'Montserrat', sans-serif;
        }
        
        .preview-card {
            width: 1200px;
            height: 630px;
            background: url('images/start_page.webp') center center / cover no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .content {
            position: relative;
            z-index: 2;
            color: white;
        }
        
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 80px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        .envelope {
            font-size: 120px;
            margin: 20px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        .names {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-style: italic;
            margin-top: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        .date {
            font-family: 'Great Vibes', cursive;
            font-size: 36px;
            margin-top: 15px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            font-size: 14px;
            color: #5a4a3a;
        }
    </style>
</head>
<body>
    <div class="preview-card">
        <div class="overlay"></div>
        <div class="content">
            <div class="title">Приглашение на свадьбу</div>
            <div class="envelope">💌</div>
            <div class="names">Алексей & Евгения</div>
            <div class="date">12 сентября 2026</div>
        </div>
    </div>
    
    <div class="hint">
        Нажми <strong>Print Screen</strong> или используй инструмент "Ножницы" чтобы сохранить как картинку<br>
        Затем загрузи в папку <code>images/preview-card.jpg</code>
    </div>
</body>
</html>
