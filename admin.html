<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Анкеты гостей</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #F5F1EB;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #D4C4B0;
            border-radius: 5px;
            font-size: 14px;
        }
        .login-form button {
            padding: 12px 30px;
            background: #8B7355;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        /* Таблица для десктопа */
        .desktop-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .desktop-table th, .desktop-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #D4C4B0;
        }
        .desktop-table th {
            background: #F5F1EB;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        /* Карточки для мобильных */
        .mobile-cards {
            display: none;
            margin-top: 20px;
        }
        .guest-card {
            background: #F5F1EB;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .guest-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #D4C4B0;
        }
        .guest-number {
            font-weight: 600;
            color: #8B7355;
            font-size: 14px;
        }
        .guest-name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            flex: 1;
            margin-left: 10px;
        }
        .guest-info {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .guest-info-label {
            font-weight: 600;
            color: #8B7355;
            margin-right: 5px;
        }
        .guest-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #D4C4B0;
        }
        
        .yes { color: #4CAF50; font-weight: 600; }
        .no { color: #f44336; font-weight: 600; }
        .error { color: #f44336; text-align: center; margin-top: 10px; }
        #guestsTable { display: none; }
        .logout-btn {
            float: right;
            padding: 8px 15px;
            background: #8B7355;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .edit-btn {
            background: #2196F3;
            color: white;
        }
        .delete-btn {
            background: #f44336;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h2 {
            margin-bottom: 20px;
            font-family: 'Cormorant Garamond', serif;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #D4C4B0;
            border-radius: 5px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .save-btn {
            background: #4CAF50;
            color: white;
        }
        .cancel-btn {
            background: #999;
            color: white;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 24px;
            }
            .desktop-table {
                display: none;
            }
            .mobile-cards {
                display: block;
            }
            .logout-btn {
                float: none;
                width: 100%;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection" class="login-form">
            <h1> Вход в админку</h1>
            <input type="email" id="emailInput" placeholder="Email">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <p id="loginError" class="error"></p>
        </div>
        
        <div id="guestsTable">
            <h1>📋 Анкеты гостей (Админ)</h1>
            <button onclick="logout()" class="logout-btn">Выйти</button>
            
            <!-- Таблица для десктопа -->
            <table class="desktop-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>ФИО</th>
                        <th>Присутствие</th>
                        <th>Напитки</th>
                        <th>Дата</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="guestsBody"></tbody>
            </table>
            
            <!-- Карточки для мобильных -->
            <div class="mobile-cards" id="mobileCards"></div>
        </div>
    </div>
    
    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Редактировать анкету</h2>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="Имя">
            <textarea id="editAttendance" placeholder="Присутствие" rows="2"></textarea>
            <textarea id="editDrinks" placeholder="Напитки (через запятую)" rows="3"></textarea>
            <div class="modal-buttons">
                <button onclick="closeEditModal()" class="cancel-btn">Отмена</button>
                <button onclick="saveEdit()" class="save-btn">Сохранить</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://htcrttlarrvnuldbpewk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0Y3J0dGxhcnJ2bnVsZGJwZXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTUwNzMsImV4cCI6MjA5NjY5MTA3M30.28t3LPpFLDxa1BmbCFLeofN8zR4wJtx9JS625cLxU0k';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                showAdminPanel();
                loadGuests();
            }
        });
        
        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            if (error) {
                document.getElementById('loginError').textContent = 'Неверный email или пароль!';
            } else {
                showAdminPanel();
                loadGuests();
            }
        }
        
        function showAdminPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('guestsTable').style.display = 'block';
        }
        
        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }
        
        async function loadGuests() {
            const { data: guests, error } = await supabaseClient
                .from('guests')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Ошибка загрузки:', error);
                alert('Ошибка загрузки данных');
                return;
            }
            
            // Заполняем таблицу для десктопа
            const tbody = document.getElementById('guestsBody');
            tbody.innerHTML = '';
            
            // Заполняем карточки для мобильных
            const mobileCards = document.getElementById('mobileCards');
            mobileCards.innerHTML = '';
            
            if (guests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">Пока нет анкет</td></tr>';
                mobileCards.innerHTML = '<p style="text-align: center; color: #999;">Пока нет анкет</p>';
                return;
            }
            
            guests.forEach((guest, index) => {
                // Таблица (десктоп)
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${guest.number || index + 1}</td>
                    <td>${guest.name}</td>
                    <td class="${guest.attendance.includes('Да') ? 'yes' : 'no'}">${guest.attendance}</td>
                    <td>${guest.drinks || '-'}</td>
                    <td>${new Date(guest.created_at).toLocaleString('ru-RU')}</td>
                    <td>
                        <button onclick="editGuest('${guest.id}', '${guest.name.replace(/'/g, "\\'")}', '${guest.attendance.replace(/'/g, "\\'")}', '${(guest.drinks || '').replace(/'/g, "\\'")}')" class="action-btn edit-btn">Редактировать</button>
                        <button onclick="deleteGuest('${guest.id}')" class="action-btn delete-btn">Удалить</button>
                    </td>
                `;
                tbody.appendChild(row);
                
                // Карточка (мобильная)
                const card = document.createElement('div');
                card.className = 'guest-card';
                card.innerHTML = `
                    <div class="guest-card-header">
                        <span class="guest-number">№${guest.number || index + 1}</span>
                        <span class="guest-name">${guest.name}</span>
                    </div>
                    <div class="guest-info">
                        <span class="guest-info-label">Присутствие:</span>
                        <span class="${guest.attendance.includes('Да') ? 'yes' : 'no'}">${guest.attendance}</span>
                    </div>
                    <div class="guest-info">
                        <span class="guest-info-label">Напитки:</span>
                        <span>${guest.drinks || '-'}</span>
                    </div>
                    <div class="guest-info">
                        <span class="guest-info-label">Дата:</span>
                        <span>${new Date(guest.created_at).toLocaleString('ru-RU')}</span>
                    </div>
                    <div class="guest-actions">
                        <button onclick="editGuest('${guest.id}', '${guest.name.replace(/'/g, "\\'")}', '${guest.attendance.replace(/'/g, "\\'")}', '${(guest.drinks || '').replace(/'/g, "\\'")}')" class="action-btn edit-btn">Редактировать</button>
                        <button onclick="deleteGuest('${guest.id}')" class="action-btn delete-btn">Удалить</button>
                    </div>
                `;
                mobileCards.appendChild(card);
            });
        }
        
        function editGuest(id, name, attendance, drinks) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editAttendance').value = attendance;
            document.getElementById('editDrinks').value = drinks;
            document.getElementById('editModal').style.display = 'block';
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value;
            const attendance = document.getElementById('editAttendance').value;
            const drinks = document.getElementById('editDrinks').value;
            
            const { error } = await supabaseClient
                .from('guests')
                .update({ name, attendance, drinks })
                .eq('id', id);
            
            if (error) {
                alert('Ошибка сохранения: ' + error.message);
            } else {
                closeEditModal();
                loadGuests();
                alert('Анкета обновлена!');
            }
        }
        
        async function deleteGuest(id) {
            if (!confirm('Вы уверены, что хотите удалить эту анкету?')) return;
            
            const { error } = await supabaseClient
                .from('guests')
                .delete()
                .eq('id', id);
            
            if (error) {
                alert('Ошибка удаления: ' + error.message);
            } else {
                loadGuests();
                alert('Анкета удалена!');
            }
        }
    </script>
</body>
</html>
