<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Анкеты гостей</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #F5F1EB;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #D4C4B0;
            border-radius: 5px;
            font-size: 14px;
        }
        .login-form button {
            padding: 12px 30px;
            background: #8B7355;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #D4C4B0;
        }
        th {
            background: #F5F1EB;
            font-weight: 600;
            color: #1a1a1a;
        }
        .yes { color: #4CAF50; font-weight: 600; }
        .no { color: #f44336; font-weight: 600; }
        .error { color: #f44336; text-align: center; margin-top: 10px; }
        #guestsTable { display: none; }
        .logout-btn {
            float: right;
            padding: 8px 15px;
            background: #8B7355;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .action-btn {
            padding: 6px 12px;
            margin: 0 3px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .edit-btn {
            background: #2196F3;
            color: white;
        }
        .delete-btn {
            background: #f44336;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h2 {
            margin-bottom: 20px;
            font-family: 'Cormorant Garamond', serif;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #D4C4B0;
            border-radius: 5px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .save-btn {
            background: #4CAF50;
            color: white;
        }
        .cancel-btn {
            background: #999;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection" class="login-form">
            <h1>🔐 Вход в админку</h1>
            <input type="password" id="passwordInput" placeholder="Введите пароль админа">
            <button onclick="login()">Войти</button>
            <p id="loginError" class="error"></p>
        </div>
        
        <div id="guestsTable">
            <h1>📋 Анкеты гостей (Админ)</h1>
            <button onclick="logout()" class="logout-btn">Выйти</button>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Присутствие</th>
                        <th>Напитки</th>
                        <th>Дата</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="guestsBody"></tbody>
            </table>
        </div>
    </div>
    
    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Редактировать анкету</h2>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="Имя">
            <textarea id="editAttendance" placeholder="Присутствие" rows="2"></textarea>
            <textarea id="editDrinks" placeholder="Напитки (через запятую)" rows="3"></textarea>
            <div class="modal-buttons">
                <button onclick="closeEditModal()" class="cancel-btn">Отмена</button>
                <button onclick="saveEdit()" class="save-btn">Сохранить</button>
            </div>
        </div>
    </div>
    
    <script>
        // ===== Управление токенами =====
        let accessToken = localStorage.getItem('adminAccessToken') || '';
        let refreshToken = localStorage.getItem('adminRefreshToken') || '';
        
        // Проверка токена при загрузке
        if (accessToken && refreshToken) {
            checkAuth();
        }
        
        // ===== API запрос с автоматическим обновлением токена =====
        async function apiRequest(url, options = {}) {
            // Добавляем accessToken в заголовки
            options.headers = {
                ...options.headers,
                'x-auth-token': accessToken,
                'Content-Type': 'application/json'
            };
            
            try {
                let response = await fetch(url, options);
                
                // Если токен истек - пробуем обновить
                if (response.status === 401) {
                    const data = await response.json();
                    
                    if (data.code === 'TOKEN_EXPIRED') {
                        // Пытаемся обновить accessToken
                        const newToken = await refreshAccessToken();
                        
                        if (newToken) {
                            // Повторяем запрос с новым токеном
                            options.headers['x-auth-token'] = newToken;
                            response = await fetch(url, options);
                        } else {
                            // Refresh token тоже истек - нужно логиниться заново
                            alert('Сессия истекла. Пожалуйста, войдите снова.');
                            logout();
                            return null;
                        }
                    } else if (data.code === 'REFRESH_TOKEN_EXPIRED') {
                        alert('Сессия истекла. Пожалуйста, войдите снова.');
                        logout();
                        return null;
                    }
                }
                
                return response;
            } catch (err) {
                console.error('Ошибка API запроса:', err);
                throw err;
            }
        }
        
        // ===== Обновление accessToken =====
        async function refreshAccessToken() {
            if (!refreshToken) {
                return null;
            }
            
            try {
                const response = await fetch('/api/refresh-token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refreshToken })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    accessToken = data.accessToken;
                    localStorage.setItem('adminAccessToken', accessToken);
                    return accessToken;
                } else {
                    return null;
                }
            } catch (err) {
                console.error('Ошибка обновления токена:', err);
                return null;
            }
        }
        
        // ===== Проверка авторизации =====
        async function checkAuth() {
            try {
                const response = await apiRequest('/api/guests');
                
                if (response && response.ok) {
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('guestsTable').style.display = 'block';
                    loadGuests();
                } else {
                    clearTokens();
                }
            } catch (error) {
                console.error('Ошибка проверки токена:', error);
                clearTokens();
            }
        }
        
        // ===== Очистка токенов =====
        function clearTokens() {
            accessToken = '';
            refreshToken = '';
            localStorage.removeItem('adminAccessToken');
            localStorage.removeItem('adminRefreshToken');
        }
        
        // ===== Логин =====
        async function login() {
            const input = document.getElementById('passwordInput').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: input, role: 'admin' })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Сохраняем оба токена
                    accessToken = data.accessToken;
                    refreshToken = data.refreshToken;
                    localStorage.setItem('adminAccessToken', accessToken);
                    localStorage.setItem('adminRefreshToken', refreshToken);
                    
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('guestsTable').style.display = 'block';
                    loadGuests();
                } else {
                    document.getElementById('loginError').textContent = 'Неверный пароль!';
                }
            } catch (error) {
                console.error('Ошибка входа:', error);
                document.getElementById('loginError').textContent = 'Ошибка подключения';
            }
        }
        
        // ===== Logout =====
        function logout() {
            clearTokens();
            location.reload();
        }
        
        // ===== Загрузка гостей =====
        async function loadGuests() {
            try {
                const response = await apiRequest('/api/guests');
                
                if (!response || !response.ok) throw new Error('Ошибка авторизации');
                
                const guests = await response.json();
                const tbody = document.getElementById('guestsBody');
                tbody.innerHTML = '';
                
                if (guests.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">Пока нет анкет</td></tr>';
                    return;
                }
                
                guests.forEach(guest => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${guest.id}</td>
                        <td>${guest.name}</td>
                        <td class="${guest.attendance.includes('Да') ? 'yes' : 'no'}">${guest.attendance}</td>
                        <td>${guest.drinks}</td>
                        <td>${new Date(guest.created_at).toLocaleString('ru-RU')}</td>
                        <td>
                            <button onclick="editGuest(${guest.id}, '${guest.name}', '${guest.attendance}', '${guest.drinks}')" class="action-btn edit-btn">Редактировать</button>
                            <button onclick="deleteGuest(${guest.id})" class="action-btn delete-btn">Удалить</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка загрузки данных');
            }
        }
        
        // ===== Редактирование =====
        function editGuest(id, name, attendance, drinks) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editAttendance').value = attendance;
            document.getElementById('editDrinks').value = drinks;
            document.getElementById('editModal').style.display = 'block';
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value;
            const attendance = document.getElementById('editAttendance').value;
            const drinks = document.getElementById('editDrinks').value.split(',').map(d => d.trim());
            
            try {
                const response = await apiRequest(`/api/admin/guests/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ name, attendance, drinks })
                });
                
                if (response && response.ok) {
                    closeEditModal();
                    loadGuests();
                    alert('Анкета обновлена!');
                } else {
                    throw new Error('Ошибка сохранения');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
        
        // ===== Удаление =====
        async function deleteGuest(id) {
            if (!confirm('Вы уверены, что хотите удалить эту анкету?')) return;
            
            try {
                const response = await apiRequest(`/api/admin/guests/${id}`, {
                    method: 'DELETE'
                });
                
                if (response && response.ok) {
                    loadGuests();
                    alert('Анкета удалена!');
                } else {
                    throw new Error('Ошибка удаления');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
    </script>
</body>
</html>
