<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр анкет гостей</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #F5F1EB;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #D4C4B0;
            border-radius: 5px;
            font-size: 14px;
        }
        .login-form button {
            padding: 12px 30px;
            background: #8B7355;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        /* Таблица для десктопа */
        .desktop-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        .desktop-table th, .desktop-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #D4C4B0;
            vertical-align: top;
        }
        .desktop-table th {
            background: #F5F1EB;
            font-weight: 600;
            color: #1a1a1a;
            white-space: nowrap;
        }
        
        /* Карточки для мобильных */
        .mobile-cards {
            display: none;
            margin-top: 20px;
        }
        .guest-card {
            background: #F5F1EB;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .guest-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #D4C4B0;
        }
        .guest-number {
            font-weight: 600;
            color: #8B7355;
            font-size: 14px;
        }
        .guest-name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            flex: 1;
            margin-left: 10px;
        }
        .guest-info {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .guest-info-label {
            font-weight: 600;
            color: #8B7355;
            margin-right: 5px;
        }
        
        .yes { color: #4CAF50; font-weight: 600; }
        .no { color: #f44336; font-weight: 600; }
        .error { color: #f44336; text-align: center; margin-top: 10px; }
        #guestsTable { display: none; }
        .logout-btn {
            float: right;
            padding: 8px 15px;
            background: #8B7355;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .info-box {
            background: #E3F2FD;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #1976D2;
            text-align: center;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 24px;
            }
            .desktop-table {
                display: none;
            }
            .mobile-cards {
                display: block;
            }
            .logout-btn {
                float: none;
                width: 100%;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection" class="login-form">
            <h1>👁️ Просмотр анкет</h1>
            <input type="email" id="emailInput" placeholder="Email">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <p id="loginError" class="error"></p>
        </div>
        
        <div id="guestsTable">
            <h1>📋 Анкеты гостей (Только просмотр)</h1>
            <button onclick="logout()" class="logout-btn">Выйти</button>
            <div class="info-box">
                ℹ️ Режим только для просмотра. Редактирование и удаление недоступны.
            </div>
            
            <!-- Таблица для десктопа -->
            <table class="desktop-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>ФИО взрослого</th>
                        <th>Взрослый</th>
                        <th>ФИО ребенка</th>
                        <th>Ребенок</th>
                        <th>Присутствие</th>
                        <th>Напитки</th>
                        <th>Крепкий алкоголь (уточнение)</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="guestsBody"></tbody>
            </table>
            
            <!-- Карточки для мобильных -->
            <div class="mobile-cards" id="mobileCards"></div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://htcrttlarrvnuldbpewk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0Y3J0dGxhcnJ2bnVsZGJwZXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTUwNzMsImV4cCI6MjA5NjY5MTA3M30.28t3LPpFLDxa1BmbCFLeofN8zR4wJtx9JS625cLxU0k';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                showViewerPanel();
                loadGuests();
            }
        });
        
        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            if (error) {
                document.getElementById('loginError').textContent = 'Неверный email или пароль!';
            } else {
                showViewerPanel();
                loadGuests();
            }
        }
        
        function showViewerPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('guestsTable').style.display = 'block';
        }
        
        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }
        
        // Безопасное экранирование для HTML
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        
        async function loadGuests() {
            const { data: guests, error } = await supabaseClient
                .from('guests')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Ошибка загрузки:', error);
                alert('Ошибка загрузки данных');
                return;
            }
            
            const tbody = document.getElementById('guestsBody');
            tbody.innerHTML = '';
            
            const mobileCards = document.getElementById('mobileCards');
            mobileCards.innerHTML = '';
            
            if (guests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #999;">Пока нет анкет</td></tr>';
                mobileCards.innerHTML = '<p style="text-align: center; color: #999;">Пока нет анкет</p>';
                return;
            }
            
            guests.forEach((guest, index) => {
                const isAdult = guest.is_adult || 'Да';
                const childName = guest.child_name || '-';
                const isChild = guest.is_child || 'Нет';
                
                // Таблица (десктоп)
                const strongDetails = guest.strong_drink_details || '-';
const strongDisplay = strongDetails !== '-' 
    ? `<span style="color: #8B7355; font-weight: 500;">${escapeHtml(strongDetails)}</span>` 
    : '-';

row.innerHTML = `
    <td>${guest.number || index + 1}</td>
    <td>${escapeHtml(guest.name)}</td>
    <td class="yes">${escapeHtml(isAdult)}</td>
    <td>${escapeHtml(childName)}</td>
    <td class="${isChild === 'Да' ? 'yes' : 'no'}">${escapeHtml(isChild)}</td>
    <td class="${guest.attendance.includes('Да') ? 'yes' : 'no'}">${escapeHtml(guest.attendance)}</td>
    <td>${escapeHtml(guest.drinks) || '-'}</td>
    <td>${strongDisplay}</td>
    <td>${new Date(guest.created_at).toLocaleString('ru-RU')}</td>
`;
                tbody.appendChild(row);
                
                // Карточка (мобильная)
                const card = document.createElement('div');
                card.className = 'guest-card';
                card.innerHTML = `
                    <div class="guest-card-header">
                        <span class="guest-number">№${guest.number || index + 1}</span>
                        <span class="guest-name">${escapeHtml(guest.name)}</span>
                    </div>
                    <div class="guest-info">
                        <span class="guest-info-label">Взрослый:</span>
                        <span class="yes">${escapeHtml(isAdult)}</span>
                    </div>
                    <div class="guest-info">
                        <span class="guest-info-label">Ребенок:</span>
                        <span>${escapeHtml(childName)}</span>
                        <span class="${isChild === 'Да' ? 'yes' : 'no'}" style="margin-left: 8px;">(${escapeHtml(isChild)})</span>
                    </div>
                    <div class="guest-info">
                        <span class="guest-info-label">Присутствие:</span>
                        <span class="${guest.attendance.includes('Да') ? 'yes' : 'no'}">${escapeHtml(guest.attendance)}</span>
                    </div>
                    <div class="guest-info">
                        <span class="guest-info-label">Напитки:</span>
                        <span>${escapeHtml(guest.drinks) || '-'}</span>
                    </div>
                    ${strongDetails !== '-' ? `
<div class="guest-info">
    <span class="guest-info-label">Крепкий алкоголь:</span>
    <span style="color: #8B7355; font-weight: 500;">${escapeHtml(strongDetails)}</span>
</div>
` : ''}
                    <div class="guest-info">
                        <span class="guest-info-label">Дата:</span>
                        <span>${new Date(guest.created_at).toLocaleString('ru-RU')}</span>
                    </div>
                `;
                mobileCards.appendChild(card);
            });
        }
    </script>
</body>
</html>
